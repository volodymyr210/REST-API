version: '3.8'

services:
  mongo_db:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: books
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  api:
    build: .
    command: flask run --host=0.0.0.0 --port=5000
    volumes:
      - ./lab6:/app
    working_dir: /app
    depends_on:
      - mongo_db
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - MONGODB_URL=mongodb://mongo_admin:password@mongo_db:27017/books?authSource=admin
    ports:
      - "5000:5000"

volumes:
  mongo_data:
